name: Deploy Browse2Browse to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
          node --check backend/src/server.js
          node --check cloudflare/src/index.js
          node -e "JSON.parse(require('node:fs').readFileSync('cloudflare/wrangler.jsonc', 'utf8'))"
      - name: Validate Cloudflare Worker bundle
        run: npx --yes wrangler@4.152.0 deploy --dry-run
        working-directory: cloudflare
      - name: Build static frontend artifact
        run: |
          mkdir _site
          cp index.html app.js styles.css config.js favicon.svg manifest.webmanifest _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

